[project]
name = "b17-conveyor"
version = "0.1.0"
description = "Модель конвеєрної системи B17 на рушії spn: мережа, параметри, статистика прогону"
requires-python = "==3.14.*"
dependencies = ["spn-engine"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
spn-engine = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "conveyor"

[tool.pytest.ini_options]
testpaths = ["tests"]
