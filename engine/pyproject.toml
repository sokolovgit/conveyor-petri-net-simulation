[project]
name = "spn-engine"
version = "0.1.0"
description = "Рушій стохастичної мережі Петрі з багатоканальними переходами"
requires-python = "==3.14.*"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spn"

[tool.pytest.ini_options]
testpaths = ["tests"]
